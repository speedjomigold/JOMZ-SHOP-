<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>JOMZ SHOP - Admin Dashboard</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            font-family: Arial, sans-serif;

            background: #0f0f0f;

            color: white;

        }


        header {

            background: #151515;

            padding: 20px;

            text-align: center;

            border-bottom: 1px solid #333;

        }


        header h1 {

            margin: 0;

            color: #00ff88;

        }


        .container {

            width: 95%;

            max-width: 1100px;

            margin: 25px auto;

        }


        /* STATISTICS */

        .stats {

            display: grid;

            grid-template-columns:
                repeat(4, 1fr);

            gap: 15px;

            margin-bottom: 20px;

        }


        .stat {

            background: #191919;

            padding: 20px;

            border-radius: 12px;

            text-align: center;

            border: 1px solid #292929;

        }


        .stat h2 {

            margin: 5px 0;

            color: #00ff88;

        }


        /* CONTROLS */

        .controls {

            display: flex;

            gap: 10px;

            margin-bottom: 15px;

        }


        #search {

            flex: 1;

            padding: 13px;

            border: none;

            border-radius: 8px;

            background: #222;

            color: white;

            outline: none;

        }


        .refresh {

            padding: 13px 18px;

            border: none;

            border-radius: 8px;

            background: #00ff88;

            color: black;

            font-weight: bold;

            cursor: pointer;

        }


        /* FILTERS */

        .filters {

            display: flex;

            flex-wrap: wrap;

            gap: 10px;

            margin-bottom: 20px;

        }


        .filter {

            padding: 10px 14px;

            border: none;

            border-radius: 7px;

            background: #222;

            color: white;

            cursor: pointer;

            font-weight: bold;

        }


        .filter.active {

            background: #00ff88;

            color: black;

        }


        /* ORDER CARD */

        .order {

            background: #191919;

            border: 1px solid #303030;

            border-radius: 12px;

            padding: 20px;

            margin-bottom: 15px;

        }


        .order h3 {

            margin-top: 0;

            color: #00ff88;

        }


        .order p {

            margin: 8px 0;

        }


        /* PAYMENT */

        .payment-awaiting {

            color: #ffd000;

            font-weight: bold;

        }


        .payment-paid {

            color: #00ff88;

            font-weight: bold;

        }


        .payment-not-received {

            color: #ff4444;

            font-weight: bold;

        }


        /* ORDER STATUS */

        .status-pending {

            color: #ffd000;

            font-weight: bold;

        }


        .status-completed {

            color: #00ff88;

            font-weight: bold;

        }


        /* BUTTONS */

        button.action {

            padding: 10px 15px;

            margin-top: 12px;

            margin-right: 8px;

            border: none;

            border-radius: 7px;

            cursor: pointer;

            font-weight: bold;

        }


        .confirm {

            background: #00ff88;

            color: black;

        }


        .complete {

            background: #008cff;

            color: white;

        }


        .not-received {

            background: #ff4444;

            color: white;

        }


        .delete {

            background: #444;

            color: white;

        }


        .receipt {

            background: #9b59b6;

            color: white;

        }


        /* EMPTY MESSAGE */

        .empty {

            text-align: center;

            padding: 30px;

            color: #aaa;

        }


        /* MOBILE */

        @media (max-width: 700px) {

            .stats {

                grid-template-columns:
                    repeat(2, 1fr);

            }


            .controls {

                flex-direction: column;

            }


            .refresh {

                width: 100%;

            }

        }


        @media (max-width: 400px) {

            .stats {

                grid-template-columns: 1fr;

            }

        }
    /* =================================
   JOMZ SHOP NEW ORDER POPUP
================================= */

.jomz-admin-popup {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.75);
    justify-content: center;
    align-items: center;
    z-index: 9999;
    padding: 20px;
}

.jomz-admin-popup-box {
    width: 100%;
    max-width: 380px;
    background: #151515;
    border: 2px solid #00ff88;
    border-radius: 18px;
    padding: 25px;
    text-align: center;
    box-shadow:
        0 0 15px #00ff88,
        0 0 40px rgba(0, 255, 136, 0.4);
    animation: jomzPopupIn 0.35s ease;
}

.jomz-admin-popup-box h2 {
    margin-top: 0;
    color: #00ff88;
    font-size: 24px;
}

.jomz-admin-popup-box p {
    color: white;
    font-size: 17px;
    line-height: 1.5;
}

.jomz-admin-popup-box button {
    margin-top: 15px;
    padding: 12px 25px;
    border: none;
    border-radius: 8px;
    background: #00ff88;
    color: black;
    font-weight: bold;
    cursor: pointer;
    font-size: 15px;
}

.jomz-admin-popup-box button:hover {
    transform: scale(1.05);
}

@keyframes jomzPopupIn {
    from {
        opacity: 0;
        transform: scale(0.8);
    }

    to {
        opacity: 1;
        transform: scale(1);
    }
}

    </style>

</head>


<body>

<script>
fetch("/api/admin-status")
    .then(response => response.json())
    .then(data => {
        if (!data.loggedIn) {
            window.location.href = "login.html";
        }
    })
    .catch(() => {
        window.location.href = "login.html";
    });
    
    
    
    
    function logoutAdmin() {

    fetch("/api/logout", {
        method: "POST"
    })

    .then(response => response.json())

    .then(data => {

        if (data.success) {

            window.location.href =
                "login.html";

        }

    })

    .catch(error => {

        console.error(
            "Logout error:",
            error
        );

    });

}
</script>
    
<header>

    <h1>JOMZ SHOP</h1>

    <p>Admin Dashboard</p>

    <button onclick="logoutAdmin()" id="logoutBtn">
        LOG OUT
    </button>

</header>


<div class="container">


    <!-- STATISTICS -->

    <div class="stats">


        <div class="stat">

            <p>🛒 Total Orders</p>

            <h2 id="totalOrders">0</h2>

        </div>


        <div class="stat">

            <p>⏳ Pending Orders</p>

            <h2 id="pendingOrders">0</h2>

        </div>


        <div class="stat">

            <p>💰 Paid Orders</p>

            <h2 id="paidOrders">0</h2>

        </div>


        <div class="stat">

            <p>✅ Completed</p>

            <h2 id="completedOrders">0</h2>

        </div>


        <div class="stat">

            <p>💰 Total Revenue</p>

            <h2 id="totalRevenue">₦0</h2>

        </div>


        <div class="stat">

            <p>💵 Completed Revenue</p>

            <h2 id="completedRevenue">₦0</h2>

        </div>


        <div class="stat">

            <p>📅 Today's Revenue</p>

            <h2 id="todayRevenue">₦0</h2>

        </div>


        <div class="stat">

            <p>📊 Today's Orders</p>

            <h2 id="todayOrders">0</h2>

        </div>


    </div>



    <!-- SEARCH -->

    <div class="controls">

        <input
            type="text"
            id="search"
            placeholder="Search Player ID, Order ID or Package..."
            oninput="displayOrders()"
        >


        <button
            class="refresh"
            onclick="loadOrders()"
        >

            🔄 REFRESH

        </button>

    </div>



    <!-- FILTERS -->

    <div class="filters">


        <button
            class="filter active"
            onclick="setFilter('All', this)"
        >

            ALL

        </button>


        <button
            class="filter"
            onclick="setFilter('Pending', this)"
        >

            🟡 PENDING

        </button>


        <button
            class="filter"
            onclick="setFilter('Awaiting Confirmation', this)"
        >

            💳 PAYMENT WAITING

        </button>


        <button
            class="filter"
            onclick="setFilter('Paid', this)"
        >

            💰 PAID

        </button>


        <button
            class="filter"
            onclick="setFilter('Completed', this)"
        >

            ✅ COMPLETED

        </button>
        
        <button
    class="filter"
    onclick="setFilter('Payment Not Received', this)"
>
    ❌ PAYMENT NOT COMPLETED
</button>


    </div>



    <!-- ORDERS -->

    <div id="orders">

        <div class="empty">

            Loading orders...

        </div>

    </div>


</div>

<!-- JOMZ SHOP NEW ORDER POPUP -->

<div
    id="jomzAdminPopup"
    class="jomz-admin-popup"
>

    <div class="jomz-admin-popup-box">

        <h2>🔔 NEW ORDER!</h2>

        <p id="jomzAdminPopupMessage">
            A new JOMZ SHOP order has arrived.
        </p>

        <button onclick="closeJomzAdminPopup()">
            OK
        </button>

    </div>

</div>

<script>






let allOrders = [];

let currentFilter = "All";



// =================================
// LOAD ORDERS
// =================================

async function loadOrders() {

    const ordersBox =
        document.getElementById("orders");

    try {

        const response = await fetch(
            "/api/orders"
        );

        if (response.status === 401) {

            window.location.href =
                "/login.html";

            return;

        }

        const data =
            await response.json();

        if (!response.ok) {

            ordersBox.innerHTML =
                '<div class="empty">' +
                (data.message ||
                "Could not load orders.") +
                '</div>';

            return;

        }

        if (!Array.isArray(data)) {

            ordersBox.innerHTML =
                '<div class="empty">' +
                'Invalid order data.' +
                '</div>';

            return;

        }


        // 🔔 CHECK FOR NEW ORDERS

        const previousOrderCount =
            Number(
                localStorage.getItem(
                    "jomzPreviousOrderCount"
                )
            );


        if (
            previousOrderCount > 0 &&
            data.length > previousOrderCount
        ) {

            const newOrders =
                data.length - previousOrderCount;

            
               showJomzAdminPopup(
    "🔔 " +
    newOrders +
    " new order" +
    (newOrders > 1 ? "s" : "") +
    " received!"
);

        }


        // SAVE CURRENT ORDER COUNT

        localStorage.setItem(
            "jomzPreviousOrderCount",
            data.length
        );


        allOrders = data;


        updateStats();

        displayOrders();

    }

    catch (error) {

        console.error(error);

        ordersBox.innerHTML =
            '<div class="empty">' +
            'Could not connect to the server.' +
            '</div>';

    }

}

// =================================
// UPDATE STATISTICS
// =================================

function updateStats() {

    const total =
        allOrders.length;


    const pending =

        allOrders.filter(

            order =>

                order.status !==
                "Completed"

        ).length;


    const paid =

        allOrders.filter(

            order =>

                order.paymentStatus ===
                "Paid"

        ).length;


    const completed =

        allOrders.filter(

            order =>

                order.status ===
                "Completed"

        ).length;



    const getPrice = order => {

        return Number(

            String(order.price || 0)

            .replace(/[₦,]/g, "")

        ) || 0;

    };



    const totalRevenue =

        allOrders.reduce(

            (total, order) =>

                total +
                getPrice(order),

            0

        );



    const completedRevenue =

        allOrders

        .filter(

            order =>

                order.status ===
                "Completed"

        )

        .reduce(

            (total, order) =>

                total +
                getPrice(order),

            0

        );



    const today =
        new Date().toDateString();



    const todayList =

        allOrders.filter(order => {

            if (!order.date) {

                return false;

            }


            return new Date(

                order.date

            ).toDateString()

            === today;

        });



    const todayOrders =
        todayList.length;



    const todayRevenue =

        todayList.reduce(

            (total, order) =>

                total +
                getPrice(order),

            0

        );



    document.getElementById(

        "totalOrders"

    ).textContent = total;


    document.getElementById(

        "pendingOrders"

    ).textContent = pending;


    document.getElementById(

        "paidOrders"

    ).textContent = paid;


    document.getElementById(

        "completedOrders"

    ).textContent = completed;


    document.getElementById(

        "totalRevenue"

    ).textContent =

        "₦" +
        totalRevenue.toLocaleString();


    document.getElementById(

        "completedRevenue"

    ).textContent =

        "₦" +
        completedRevenue.toLocaleString();


    document.getElementById(

        "todayRevenue"

    ).textContent =

        "₦" +
        todayRevenue.toLocaleString();


    document.getElementById(

        "todayOrders"

    ).textContent =
        todayOrders;

}



// =================================
// FILTER
// =================================

function setFilter(filter, button) {

    currentFilter = filter;


    document

        .querySelectorAll(".filter")

        .forEach(item =>

            item.classList.remove(
                "active"
            )

        );


    button.classList.add(
        "active"
    );


    displayOrders();

}



// =================================
// DISPLAY ORDERS
// =================================

function displayOrders() {

    const ordersBox =
        document.getElementById("orders");


    const search =
        document.getElementById("search")

        .value

        .toLowerCase()

        .trim();



    let filtered =

        allOrders.filter(order => {


            const orderId =

                String(order.id || "")

                .toLowerCase();


            const playerID =

                String(order.playerID || "")

                .toLowerCase();


            const product =

                String(order.product || "")

                .toLowerCase();


            return (

                orderId.includes(search) ||

                playerID.includes(search) ||

                product.includes(search)

            );

        });



    if (

        currentFilter ===
        "Pending"

    ) {

        filtered =

            filtered.filter(

                order =>

                    order.status !==
                    "Completed"

            );

    }



    if (

        currentFilter ===
        "Awaiting Confirmation"

    ) {

        filtered =

            filtered.filter(

                order =>

                    order.paymentStatus ===
                    "Awaiting Confirmation"

            );

    }



    if (

        currentFilter ===
        "Paid"

    ) {

        filtered =

            filtered.filter(

                order =>

                    order.paymentStatus ===
                    "Paid"

            );

    }



    if (

        currentFilter ===
        "Completed"

    ) {

        filtered =

            filtered.filter(

                order =>

                    order.status ===
                    "Completed"

            );

    }
    
    if (
    currentFilter ===
    "Payment Not Received"
) {

    filtered =
        filtered.filter(
            order =>
                order.paymentStatus ===
                "Payment Not Received"
        );

}



    if (filtered.length === 0) {

        ordersBox.innerHTML =

            '<div class="empty">' +
            'No orders found.' +
            '</div>';

        return;

    }



    ordersBox.innerHTML = "";



    filtered

        .slice()

        .reverse()

        .forEach(order => {


            const paymentStatus =

                order.paymentStatus ||
                "Pending";


            const orderStatus =

                order.status ||
                "Pending";


            let paymentHTML;


            if (

                paymentStatus ===
                "Awaiting Confirmation"

            ) {

                paymentHTML = `

                    <span class="payment-awaiting">

                        🟡 Awaiting Confirmation

                    </span>

                    <br>

                    <button

                        class="action confirm"

                        onclick="confirmPayment(${order.id})"

                    >

                        ✅ CONFIRM PAYMENT

                    </button>


                    <button

                        class="action not-received"

                        onclick="paymentNotReceived(${order.id})"

                    >

                        ❌ PAYMENT NOT RECEIVED

                    </button>

                `;

            }


            else if (

                paymentStatus === "Paid"

            ) {

                paymentHTML = `

                    <span class="payment-paid">

                        🟢 PAID

                    </span>

                `;

            }


            else if (

                paymentStatus ===
                "Payment Not Received"

            ) {

                paymentHTML = `

                    <span class="payment-not-received">

                        ❌ PAYMENT NOT RECEIVED

                    </span>

                `;

            }


            else {

                paymentHTML = `

                    <span>

                        ⏳ Pending

                    </span>

                `;

            }



            let statusHTML;


            if (

                orderStatus ===
                "Completed"

            ) {

                statusHTML = `

                    <span class="status-completed">

                        🟢 Completed

                    </span>

                `;

            }


            else {

                statusHTML = `

                    <span class="status-pending">

                        🟡 Pending

                    </span>

                    <br>

                    <button

                        class="action complete"

                        onclick="completeOrder(${order.id})"

                    >

                        ✅ MARK AS COMPLETED

                    </button>

                `;

            }



            const date =

                order.date

                ?

                new Date(
                    order.date
                ).toLocaleString()

                :

                "Unknown";



            const card =
                document.createElement("div");


            card.className =
                "order";


            card.innerHTML = `

                <h3>

                    Order #${order.id}

                </h3>


                <p>

                    <b>Player ID:</b>

                    ${order.playerID ||
                    "Not available"}

                </p>


                <p>

                    <b>Package:</b>

                    ${order.product ||
                    "Not available"}

                </p>


                <p>

                    <b>Quantity:</b>

                    ${order.quantity || 1}

                </p>


                <p>

                    <b>Price:</b>

                    ${order.price ||
                    "Not available"}

                </p>


                <p>

                    <b>Payment:</b>

                    ${paymentHTML}

                </p>


                <p>

                    <b>Status:</b>

                    ${statusHTML}

                </p>


                ${

                    orderStatus === "Completed"

                    ?

                    `

                    <button

                        class="action receipt"

                        onclick="window.location.href='receipt.html?id=${order.id}'"

                    >

                        🧾 VIEW RECEIPT

                    </button>

                    `

                    :

                    ""

                }


                <button

                    class="action delete"

                    onclick="deleteOrder(${order.id})"

                >

                    🗑️ DELETE ORDER

                </button>


                <p>

                    <b>Date:</b>

                    ${date}

                </p>

            `;


            ordersBox.appendChild(
                card
            );

        });

}



// =================================
// CONFIRM PAYMENT
// =================================

async function confirmPayment(orderId) {

    const confirmed = confirm(

        "Have you checked your bank account and confirmed that this payment was received?"

    );


    if (!confirmed) {

        return;

    }


    try {

        const response = await fetch(

            "/api/orders/" +
            orderId +
            "/payment-confirm",

            {

                method: "PUT",

                headers: {

                    "Content-Type":
                        "application/json"

                }

            }

        );


        const data =
            await response.json();


        if (data.success) {

            alert(

                "Payment confirmed successfully!"

            );


            loadOrders();

        }

        else {

            alert(

                data.message ||
                "Could not confirm payment."

            );

        }

    }

    catch (error) {

        console.error(error);


        alert(

            "Could not connect to the server."

        );

    }

}



// =================================
// PAYMENT NOT RECEIVED
// =================================

async function paymentNotReceived(orderId) {

    const confirmed = confirm(
        "Are you sure payment has not been received?"
    );

    if (!confirmed) {
        return;
    }

    try {

        const response = await fetch(
            "/api/orders/" +
            orderId +
            "/payment-not-received",
            {
                method: "PUT",
                headers: {
                    "Content-Type": "application/json"
                }
            }
        );

        const data = await response.json();

        if (data.success) {

            alert(
                "Payment marked as not received."
            );

            loadOrders();

        } else {

            alert(
                data.message ||
                "Could not update payment status."
            );

        }

    } catch (error) {

        console.error(error);

        alert(
            "Could not connect to the server."
        );

    }

}



// =================================
// COMPLETE ORDER
// =================================

async function completeOrder(orderId) {

    const confirmed = confirm(
        "Are you sure you want to mark this order as completed?"
    );

    if (!confirmed) {
        return;
    }

    try {

        const response = await fetch(
            "/api/orders/" + orderId,
            {
                method: "PUT",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    status: "Completed"
                })
            }
        );

        const data = await response.json();

        if (data.success) {

            alert(
                "Order marked as completed!"
            );

            loadOrders();

        } else {

            alert(
                data.message ||
                "Could not complete order."
            );

        }

    } catch (error) {

        console.error(error);

        alert(
            "Could not connect to the server."
        );

    }

}



// =================================
// DELETE ORDER
// =================================

async function deleteOrder(orderId) {

    const confirmed = confirm(
        "Are you sure you want to delete this order?"
    );

    if (!confirmed) {
        return;
    }

    try {

        const response = await fetch(
            "/api/orders/" + orderId,
            {
                method: "DELETE"
            }
        );

        const data = await response.json();

        if (data.success) {

            alert(
                "Order deleted successfully."
            );

            loadOrders();

        } else {

            alert(
                data.message ||
                "Could not delete order."
            );

        }

    } catch (error) {

        console.error(error);

        alert(
            "Could not connect to the server."
        );

    }

}


    // =================================
// START ADMIN DASHBOARD
// =================================

loadOrders();


// =================================
// AUTOMATIC ADMIN REFRESH
// =================================

setInterval(function () {

    loadOrders();

}, 5000);

    // =================================
// JOMZ SHOP ADMIN POPUP
// =================================

function showJomzAdminPopup(message) {

    const popup =
        document.getElementById("jomzAdminPopup");

    const popupMessage =
        document.getElementById("jomzAdminPopupMessage");

    if (!popup || !popupMessage) return;

    popupMessage.textContent = message;

    popup.style.display = "flex";
}


function closeJomzAdminPopup() {

    const popup =
        document.getElementById("jomzAdminPopup");

    if (popup) {

        popup.style.display = "none";

    }

}
 
</script>
